```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Zestify Admin Panel</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="#">

            🛍️ Zestify Admin

        </a>

        <span class="text-white">
            Product Management
        </span>

    </div>

</nav>


<!-- ================= DASHBOARD ================= -->

<div class="container py-5">


    <div class="row mb-4">

        <div class="col-md-4">

            <div class="dashboard-card">

                <h6>Total Products</h6>

                <h2 id="totalProducts">
                    0
                </h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="dashboard-card">

                <h6>Platform</h6>

                <h2>
                    Zestify
                </h2>

            </div>

        </div>


        <div class="col-md-4">

            <div class="dashboard-card">

                <h6>Backend</h6>

                <h2>
                    Spring Boot
                </h2>

            </div>

        </div>

    </div>


    <!-- ================= ADD PRODUCT ================= -->

    <div class="card shadow-sm mb-5">

        <div class="card-header">

            <h4 class="mb-0">
                Add New Product
            </h4>

        </div>


        <div class="card-body">

            <form id="productForm">

                <div class="row g-3">


                    <div class="col-md-6">

                        <label class="form-label">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            class="form-control"
                            placeholder="Men's T-Shirt"
                            required>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Price
                        </label>

                        <input
                            type="number"
                            id="price"
                            class="form-control"
                            placeholder="899"
                            required>

                    </div>


                    <div class="col-md-3">

                        <label class="form-label">
                            Old Price
                        </label>

                        <input
                            type="number"
                            id="oldPrice"
                            class="form-control"
                            placeholder="1999">

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Category
                        </label>

                        <select
                            id="category"
                            class="form-select"
                            required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="Men's Fashion">
                                Men's Fashion
                            </option>

                            <option value="Women's Fashion">
                                Women's Fashion
                            </option>

                            <option value="Footwear">
                                Footwear
                            </option>

                            <option value="Accessories">
                                Accessories
                            </option>

                            <option value="Kids">
                                Kids
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6">

                        <label class="form-label">
                            Image URL
                        </label>

                        <input
                            type="text"
                            id="imageUrl"
                            class="form-control"
                            placeholder="images/product.jpg"
                            required>

                    </div>


                    <div class="col-12">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="3"
                            placeholder="Product description..."
                            required></textarea>

                    </div>


                    <div class="col-12">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            + Add Product

                        </button>

                    </div>

                </div>

            </form>


            <div
                id="message"
                class="mt-3">
            </div>

        </div>

    </div>


    <!-- ================= PRODUCT LIST ================= -->

    <div class="card shadow-sm">

        <div class="card-header">

            <h4 class="mb-0">
                Product Management
            </h4>

        </div>


        <div class="card-body">

            <div
                class="table-responsive">

                <table
                    class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Old Price</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="productTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
```
